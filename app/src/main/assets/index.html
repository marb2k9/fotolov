<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2b1d6b">
<title>FotoLov</title>
<style>
  :root{
    --bg1:#2b1d6b; --bg2:#0f6e6a; --card:#ffffff; --ink:#24204a; --muted:#6b6790;
    --green:#22c55e; --green-d:#15803d; --yellow:#ffd23f; --pink:#ff4f8b; --blue:#3b82f6;
    --radius:22px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    font-family:"Trebuchet MS","Segoe UI",Roboto,system-ui,sans-serif;
    color:var(--ink);
    background:linear-gradient(160deg,var(--bg1) 0%,#4b2a8f 45%,var(--bg2) 100%) fixed;
    overscroll-behavior:none; user-select:none; -webkit-user-select:none;
  }
  #app{max-width:520px;margin:0 auto;min-height:100%;padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 24px)}
  .top{display:flex;align-items:center;gap:10px;margin-bottom:14px;min-height:48px}
  .top h1{flex:1;margin:0;color:#fff;font-size:26px;letter-spacing:.5px;text-shadow:0 3px 0 rgba(0,0,0,.25)}
  .iconbtn{width:48px;height:48px;border-radius:16px;border:0;background:rgba(255,255,255,.18);color:#fff;font-size:24px;display:grid;place-items:center}
  .iconbtn:active{transform:scale(.94)}
  .logo{text-align:center;color:#fff;margin:10px 0 18px}
  .logo .big{font-size:46px;font-weight:900;letter-spacing:1px;text-shadow:0 4px 0 rgba(0,0,0,.25)}
  .logo .big span{color:var(--yellow)}
  .logo .sub{opacity:.85;font-size:16px;margin-top:4px}
  .card{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:0 10px 30px rgba(0,0,0,.25);margin-bottom:14px}
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:18px;padding:16px 18px;font-size:20px;font-weight:800;font-family:inherit;color:#fff;background:var(--blue);box-shadow:0 6px 0 rgba(0,0,0,.22);transition:transform .08s}
  .btn:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.22)}
  .btn[disabled]{opacity:.45;filter:grayscale(.6)}
  .btn.green{background:var(--green)} .btn.pink{background:var(--pink)} .btn.yellow{background:var(--yellow);color:#3a2a00}
  .btn.ghost{background:rgba(255,255,255,.18);box-shadow:none}
  .btn.white{background:#fff;color:var(--ink)}
  .btn.small{font-size:16px;padding:11px 12px;border-radius:14px}
  .row{display:flex;gap:10px} .row>*{flex:1}
  /* profiles */
  .profiles{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .pcard{background:#fff;border-radius:24px;padding:14px 10px 12px;text-align:center;box-shadow:0 10px 25px rgba(0,0,0,.25);position:relative;border:4px solid transparent}
  .pcard:active{transform:scale(.97)}
  .avatar{width:96px;height:96px;border-radius:50%;margin:0 auto 8px;display:grid;place-items:center;font-size:52px;background:#eee;background-size:cover;background-position:center;border:4px solid #fff;box-shadow:0 4px 12px rgba(0,0,0,.2)}
  .pname{font-size:22px;font-weight:900}
  .badge{display:inline-block;padding:4px 10px;border-radius:999px;font-size:13px;font-weight:800;color:#fff;margin-top:6px}
  .stars{font-size:14px;color:var(--muted);margin-top:6px;font-weight:700}
  .pedit{position:absolute;top:8px;right:8px;width:36px;height:36px;border-radius:12px;border:0;background:#f1effa;font-size:18px}
  .addp{display:grid;place-items:center;min-height:200px;border:3px dashed rgba(255,255,255,.6);background:rgba(255,255,255,.08);color:#fff;font-size:18px;font-weight:800;box-shadow:none}
  /* wheel */
  .who{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.15);color:#fff;border-radius:18px;padding:8px 12px;margin-bottom:10px}
  .who .avatar{width:44px;height:44px;font-size:24px;margin:0;border-width:2px}
  .who b{font-size:18px}
  .wheelwrap{position:relative;width:min(92vw,400px);aspect-ratio:1;margin:6px auto 10px}
  #wheel{width:100%;height:100%;display:block;filter:drop-shadow(0 12px 18px rgba(0,0,0,.35))}
  .pointer{position:absolute;left:50%;top:-10px;width:44px;height:58px;margin-left:-22px;transform-origin:50% 14px;z-index:2}
  .pointer svg{width:100%;height:100%;filter:drop-shadow(0 3px 3px rgba(0,0,0,.4))}
  .hub{position:absolute;left:50%;top:50%;width:22%;height:22%;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#ffe27a 40%,#f2a900);border:5px solid #fff;box-shadow:0 4px 12px rgba(0,0,0,.35);display:grid;place-items:center;font-size:28px}
  .slots{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
  .slot{background:rgba(255,255,255,.14);border:3px dashed rgba(255,255,255,.45);border-radius:18px;min-height:72px;color:#fff;display:flex;align-items:center;gap:8px;padding:8px 10px;font-weight:800;font-size:15px;line-height:1.15}
  .slot .n{width:30px;height:30px;flex:none;border-radius:50%;background:rgba(255,255,255,.25);display:grid;place-items:center;font-size:15px}
  .slot.full{background:#fff;color:var(--ink);border:3px solid #fff;animation:pop .45s ease}
  .slot.full .n{background:var(--yellow)}
  .slot .e{font-size:26px}
  @keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.08)}100%{transform:scale(1)}}
  .result{position:fixed;inset:0;display:grid;place-items:center;background:rgba(10,5,40,.55);z-index:50;animation:fade .2s}
  .result .box{background:#fff;border-radius:28px;padding:24px 22px;text-align:center;width:min(86vw,360px);animation:pop .5s ease}
  .result .em{font-size:84px;line-height:1}
  .result .t{font-size:24px;font-weight:900;margin:10px 0 18px}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  /* photo tasks */
  .task{background:#fff;border-radius:24px;padding:14px;margin-bottom:14px;box-shadow:0 10px 25px rgba(0,0,0,.25);border:4px solid transparent}
  .task.done{border-color:var(--green)}
  .task h3{margin:0 0 10px;font-size:20px;display:flex;align-items:center;gap:10px}
  .task h3 .n{width:34px;height:34px;flex:none;border-radius:50%;background:var(--yellow);display:grid;place-items:center;font-size:17px}
  .task h3 .e{font-size:30px}
  .preview{position:relative;border-radius:18px;overflow:hidden;margin-bottom:10px;background:#eee}
  .preview img{display:block;width:100%;max-height:340px;object-fit:cover}
  .preview .ok{position:absolute;top:10px;right:10px;background:var(--green);color:#fff;font-weight:900;border-radius:999px;padding:6px 12px;font-size:16px;box-shadow:0 3px 8px rgba(0,0,0,.3)}
  .progress{height:16px;background:rgba(255,255,255,.2);border-radius:999px;overflow:hidden;margin:4px 0 14px}
  .progress div{height:100%;background:linear-gradient(90deg,var(--yellow),var(--green));border-radius:999px;transition:width .4s}
  .hint{color:#fff;opacity:.9;text-align:center;font-size:15px;margin:6px 0 12px}
  /* collage */
  .collageimg{width:100%;border-radius:18px;box-shadow:0 12px 30px rgba(0,0,0,.4);display:block;margin-bottom:14px}
  .album{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .album .it{background:#fff;border-radius:16px;padding:6px;box-shadow:0 6px 16px rgba(0,0,0,.25)}
  .album img{width:100%;border-radius:12px;display:block}
  .album .d{font-size:12px;color:var(--muted);text-align:center;margin-top:4px;font-weight:700}
  .empty{color:#fff;text-align:center;opacity:.85;padding:30px 10px;font-size:17px}
  /* form */
  label.l{display:block;font-weight:800;margin:12px 0 6px}
  input.txt{width:100%;font-size:20px;padding:12px 14px;border-radius:14px;border:3px solid #e3e0f5;font-family:inherit;font-weight:700;color:var(--ink);user-select:text;-webkit-user-select:text}
  .levels{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .lvl{border:3px solid #e3e0f5;border-radius:16px;padding:10px 4px;text-align:center;font-weight:800;background:#fff;font-family:inherit;font-size:15px;color:var(--ink)}
  .lvl .e{font-size:28px;display:block}
  .lvl.sel{border-color:var(--ink);background:#f5f3ff}
  .emojis{display:flex;flex-wrap:wrap;gap:6px}
  .emojis button{font-size:28px;width:48px;height:48px;border-radius:14px;border:3px solid #eee;background:#fff}
  .emojis button.sel{border-color:var(--ink)}
  .seasons{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .seasons .lvl{font-size:14px;padding:8px 2px}
  .seasons .lvl.hard{grid-column:1/-1;display:flex;align-items:center;justify-content:center;gap:10px;background:linear-gradient(90deg,#fff1f2,#f3e8ff);border-color:#d8b4fe;color:#6d28d9}
  .seasons .lvl.hard .e{display:inline;font-size:28px}
  .seasons .lvl.hard.sel{border-color:#6d28d9}
  .seasons .lvl small{display:block;font-size:12px;font-weight:700;opacity:.85}
  .stepper{display:flex;align-items:center;gap:12px}
  .stepper button{width:64px;height:64px;flex:none;border-radius:20px;border:0;font-size:38px;font-weight:900;line-height:1;background:var(--blue);color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.2);font-family:inherit}
  .stepper button:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.2)}
  .stepper button[disabled]{opacity:.3}
  .stepper .val{flex:1;text-align:center}
  .stepper .val b{display:block;font-size:42px;line-height:1}
  .stepper .val span{font-size:14px;color:var(--muted);font-weight:700}
  .setup{margin-top:12px}
  .setup h2{margin:0 0 4px;font-size:19px}
  .who .badges{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
  .who .badges .badge{margin:0}
  .toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-50%);background:#111;color:#fff;padding:12px 18px;border-radius:14px;font-weight:700;z-index:99;max-width:90vw;text-align:center;animation:fade .2s}
  .confetti{position:fixed;top:-40px;font-size:28px;z-index:60;pointer-events:none;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
  .loading{position:fixed;inset:0;background:rgba(10,5,40,.6);display:grid;place-items:center;color:#fff;font-size:22px;font-weight:900;z-index:80}
  .spinner{font-size:60px;animation:spin 1s linear infinite;display:block;text-align:center}
  @keyframes spin{to{transform:rotate(360deg)}}
  .joker{margin-top:10px}
</style>
</head>

/* ================== STORAGE ================== */
const LS = {
  get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){console.warn(e)}}
};
const DB = (()=>{
  const mem = new Map(); let dbp=null;
  function open(){
    if(dbp) return dbp;
    dbp = new Promise((res)=>{
      try{
        const r = indexedDB.open('fotolov',1);
        r.onupgradeneeded = ()=> r.result.createObjectStore('kv');
        r.onsuccess = ()=> res(r.result);
        r.onerror = ()=> res(null);
      }catch(e){ res(null); }
    });
    return dbp;
  }
  async function tx(mode, fn){
    const db = await open();
    if(!db) return fn(null);
    return new Promise((res,rej)=>{
      const t = db.transaction('kv',mode); const s=t.objectStore('kv'); const r=fn(s);
      t.oncomplete=()=>res(r && r.result); t.onerror=()=>rej(t.error);
    });
  }
  return {
    get:k=>tx('readonly',s=>s?s.get(k):{result:mem.get(k)}),
    set:(k,v)=>tx('readwrite',s=>s?s.put(v,k):(mem.set(k,v),null)),
    del:k=>tx('readwrite',s=>s?s.delete(k):(mem.delete(k),null))
  };
})();

/* image file -> downscaled JPEG dataURL */
function fileToJpeg(file,max=1400,q=.85,square=false){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file); const img=new Image();
    img.onload=()=>{
      let sw=img.naturalWidth, sh=img.naturalHeight, sx=0, sy=0;
      if(square){ const m=Math.min(sw,sh); sx=(sw-m)/2; sy=(sh-m)/2; sw=sh=m; }
      const k=Math.min(1,max/Math.max(sw,sh)); const w=Math.round(sw*k), h=Math.round(sh*k);
      const c=document.createElement('canvas'); c.width=w; c.height=h;
      const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,w,h);
      x.drawImage(img,sx,sy,sw,sh,0,0,w,h);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg',q));
    };
    img.onerror=()=>{URL.revokeObjectURL(url); rej(new Error('Obrázek nejde načíst'))};
    img.src=url;
  });
}
function pickImage(useCamera){
  return new Promise(res=>{
    const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*';
    if(useCamera) inp.setAttribute('capture','environment');
    inp.style.display='none'; document.body.appendChild(inp);
    inp.onchange=()=>{ const f=inp.files&&inp.files[0]; inp.remove(); res(f||null); };
    inp.click();
  });
}

let actx=null;
function audio(){ if(!actx){ try{actx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){} } if(actx&&actx.state==='suspended') actx.resume(); return actx; }
function tick(){
  const a=audio(); if(!a) return;
  const t=a.currentTime;
  // short noise "cvak"
  const len=Math.floor(a.sampleRate*0.03); const buf=a.createBuffer(1,len,a.sampleRate); const d=buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3);
  const src=a.createBufferSource(); src.buffer=buf;
  const bp=a.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=2400+Math.random()*400; bp.Q.value=2.5;
  const g=a.createGain(); g.gain.value=0.9;
  // a tiny "tok" body
  const o=a.createOscillator(); o.type='triangle'; o.frequency.setValueAtTime(1200,t); o.frequency.exponentialRampToValueAtTime(400,t+0.03);
  const og=a.createGain(); og.gain.setValueAtTime(0.25,t); og.gain.exponentialRampToValueAtTime(0.001,t+0.04);
  src.connect(bp).connect(g).connect(a.destination); o.connect(og).connect(a.destination);
  src.start(t); o.start(t); o.stop(t+0.05);
}
function fanfare(){
  const a=audio(); if(!a) return; const t=a.currentTime;
  [523.25,659.25,783.99,1046.5].forEach((f,i)=>{
    const o=a.createOscillator(), g=a.createGain(); o.type='square'; o.frequency.value=f;
    g.gain.setValueAtTime(0.0001,t+i*0.11); g.gain.exponentialRampToValueAtTime(0.18,t+i*0.11+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+i*0.11+(i===3?0.6:0.2));
    o.connect(g).connect(a.destination); o.start(t+i*0.11); o.stop(t+i*0.11+0.7);
  });
}
function shutter(){
  const a=audio(); if(!a) return; const t=a.currentTime;
  const len=Math.floor(a.sampleRate*0.12); const buf=a.createBuffer(1,len,a.sampleRate); const d=buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(i<len*0.3?1:Math.pow(1-i/len,2));
  const s=a.createBufferSource(); s.buffer=buf; const g=a.createGain(); g.gain.value=0.35; s.connect(g).connect(a.destination); s.start(t);
}

// game: {pid, level, season, n, pool:[task], drawn:[task], joker, phase:'spin'|'photo'}
// photos in IndexedDB: 'ph_'+pid+'_'+i  -> {src, ok:boolean}
let game=null, photos=[], current=null, screen='profiles';
const gameKey = pid => 'fl_game_'+pid;

function buildPool(level,season){
  const ok = t => season==='m' || t.z.includes(season);
  const order = level===1?[1,2,3]:level===2?[2,1,3]:[3,2,1];   // nejdřív úkoly zvolené obtížnosti
  let pool=[]; for(const l of order) pool=pool.concat(shuffle(TASKS[l].filter(ok)));
  return pool.map((t,i)=>({e:t.e,s:t.s,t:t.t,c:i%SEG_COLORS.length}));
}
const jokersFor = n => 1+Math.floor((n-4)/4);
function newGame(p){
  const n=p.nphotos;
  game={pid:p.id, level:p.level, season:p.season, n, pool:buildPool(p.level,p.season), drawn:[], joker:jokersFor(n), phase:'spin'};
  photos=new Array(n).fill(null);
  LS.set(gameKey(p.id),game);
  for(let i=0;i<MAX_PHOTOS;i++) DB.del('ph_'+p.id+'_'+i);
}
async function loadGame(p){
  const g=LS.get(gameKey(p.id),null);
  if(g && g.pool && g.level===p.level && g.season===p.season && g.n===p.nphotos){
    game=g; photos=[];
    for(let i=0;i<g.n;i++) photos.push(await dbGet('ph_'+p.id+'_'+i) || null);
  } else newGame(p);
}

const visibleSegs = () => game.pool.slice(0,12);
function sizeWheel(){
  const c=document.getElementById('wheel'); if(!c) return;
  const r=c.getBoundingClientRect(); const dpr=Math.min(window.devicePixelRatio||1,3);
  c.width=Math.round(r.width*dpr); c.height=Math.round(r.height*dpr);
}
function drawWheel(){
  const c=document.getElementById('wheel'); if(!c) return;
  const x=c.getContext('2d'); const W=c.width, R=W/2, cx=R, cy=R;
  const segs=visibleSegs(); const n=segs.length; if(!n) return; const a=Math.PI*2/n;
  x.clearRect(0,0,W,W);
  x.beginPath(); x.arc(cx,cy,R*0.995,0,Math.PI*2); x.fillStyle='#2b1d6b'; x.fill();
  const r=R*0.90;
  for(let i=0;i<n;i++){
    const st=wheel.rot+i*a;
    x.beginPath(); x.moveTo(cx,cy); x.arc(cx,cy,r,st,st+a); x.closePath();
    let col=SEG_COLORS[segs[i].c % SEG_COLORS.length];
    if(i>0 && SEG_COLORS[segs[i-1].c % SEG_COLORS.length]===col) col=SEG_COLORS[(segs[i].c+5)%SEG_COLORS.length];
    x.fillStyle=col; x.fill();
    x.lineWidth=R*0.012; x.strokeStyle='rgba(255,255,255,.9)'; x.stroke();
    x.save(); x.translate(cx,cy); x.rotate(st+a/2);
    x.textAlign='right'; x.textBaseline='middle';
    const fs=Math.max(R*0.062, Math.min(R*0.085, R*0.9/n));
    x.font=`900 ${fs}px "Trebuchet MS",Roboto,sans-serif`;
    x.fillStyle='#fff'; x.shadowColor='rgba(0,0,0,.35)'; x.shadowBlur=R*0.012; x.shadowOffsetY=R*0.006;
    x.fillText(segs[i].s, r*0.80, 0);
    x.shadowColor='transparent';
    x.font=`${fs*1.25}px sans-serif`; x.fillText(segs[i].e, r*0.97, 0);
    x.restore();
  }
  for(let i=0;i<n;i++){
    const ang=wheel.rot+i*a; const px=cx+Math.cos(ang)*R*0.945, py=cy+Math.sin(ang)*R*0.945;
    x.beginPath(); x.arc(px,py,R*0.025,0,Math.PI*2); x.fillStyle='#ffd23f'; x.fill(); x.lineWidth=R*0.006; x.strokeStyle='#b07d00'; x.stroke();
  }
}
function segIndexAtPointer(rot,n){
  const a=Math.PI*2/n; let p=(-Math.PI/2 - rot)%(Math.PI*2); if(p<0) p+=Math.PI*2;
  return Math.floor(p/a)%n;
}
function renderSlots(){

         :`<div class="slot"><span class="n">${i+1}</span><span>?</span></div>`;
  }
  el.innerHTML=h;
}
const cap = s => s.charAt(0).toUpperCase()+s.slice(1);
function renderSpinArea(){
  const el=document.getElementById('spinarea'); if(!el) return;
  const k=game.drawn.length, n=game.n;
  const jok = k>0 && game.joker>0 ? `<button class="btn ghost small joker" id="jok">🃏 Žolík: přelosovat poslední úkol (zbývá ${game.joker}×)</button>` : '';
  if(k<n){
    el.innerHTML=`<button class="btn pink" id="spin" style="font-size:26px;padding:18px">🎡 ZATOČ! <small style="font-size:16px;opacity:.9">(${k+1}/${n})</small></button>${jok}`;
    document.getElementById('spin').onclick=spin;
  } else {
    el.innerHTML=`<button class="btn green" id="go" style="font-size:24px;padding:18px">📸 Jdu fotit!</button>${jok}`;
    document.getElementById('go').onclick=()=>{game.phase='photo';saveGame();showPhotos();};
  }
  const j=document.getElementById('jok'); if(j) j.onclick=useJoker;
}
function useJoker(){
  if(wheel.spinning||game.joker<1||!game.drawn.length) return;
  const removed=game.drawn.pop(); game.joker--;   // úkol už v kole není, tím je vyřazený
  saveGame(); drawWheel(); renderSlots(); renderSpinArea();
  toast('🃏 Úkol „'+removed.s+'“ je pryč. Zatoč znovu!');
  if(game.drawn.length===0) showSpin();
}
function spin(){
  if(wheel.spinning) return;
  audio();
  const segs=visibleSegs(); const n=segs.length; if(!n){ toast('Došly úkoly 🙈'); return; }
  wheel.spinning=true;
  document.getElementById('spin').disabled=true; const j=document.getElementById('jok'); if(j) j.disabled=true;
  document.querySelectorAll('.setup button').forEach(b=>b.disabled=true);
  const start=wheel.rot;
  const target=start + Math.PI*2*(5+Math.random()*3) + Math.random()*Math.PI*2;
  const dur=5200+Math.random()*1800;
  const t0=performance.now();
  let lastIdx=segIndexAtPointer(start,n);
  const ptr=document.getElementById('ptr'); let flap=0;
  const ease=t=>1-Math.pow(1-t,4);
  function frame(now){
    const t=Math.min(1,(now-t0)/dur);
    wheel.rot=start+(target-start)*ease(t);
    const idx=segIndexAtPointer(wheel.rot,n);
    if(idx!==lastIdx){ lastIdx=idx; tick(); flap=1; if(t>0.6) vibrate(8); }
    flap*=0.82;
    if(ptr) ptr.style.transform=`rotate(${-flap*28}deg)`;
    drawWheel();
    if(t<1) wheel.raf=requestAnimationFrame(frame);
    else { wheel.spinning=false; if(ptr) ptr.style.transform=''; landed(segs[idx]); }
  }
  wheel.raf=requestAnimationFrame(frame);
}
function landed(task){
  const first=game.drawn.length===0;
  game.pool.splice(game.pool.indexOf(task),1);
  game.drawn.push(task); saveGame();
  fanfare(); vibrate(60);
  const ov=document.createElement('div'); ov.className='result';
  ov.innerHTML=`<div class="box"><div style="font-weight:800;color:#6b6790">${game.drawn.length}. úkol z ${game.n} – vyfoť:</div><div class="em">${task.e}</div><div class="t">${esc(cap(task.t))}</div><button class="btn green">👍 Jasně!</button></div>`;
  document.body.appendChild(ov);
  const close=()=>{
    ov.remove();
    if(first){ const r=wheel.rot; showSpin(); wheel.rot=r; drawWheel(); return; }   // schová nastavení
    drawWheel(); renderSlots(); renderSpinArea(); if(game.drawn.length===game.n) confetti(25);
  };
  ov.querySelector('button').onclick=close; ov.onclick=e=>{if(e.target===ov) close();};
}

/* ---------- PHOTOS ---------- */
function showPhotos(){
  screen='photo';
  const n=game.n;
  const done=photos.filter(x=>x&&x.ok).length;
  render(`
    <div class="top"><button class="iconbtn" id="back">←</button><h1>Foť! 📸</h1><span style="color:#fff;font-weight:900;font-size:20px">${done}/${n}</span></div>
    <div class="progress"><div style="width:${done/n*100}%"></div></div>
    ${game.drawn.map((t,i)=>{
      const ph=photos[i];
      let body;
      if(!ph) body=`<div class="row"><button class="btn" data-cam="${i}">📷 Vyfotit</button><button class="btn" style="background:#a855f7" data-gal="${i}">🖼️ Z galerie</button></div>`;
      else if(!ph.ok) body=`<div class="preview"><img src="${ph.src}"></div><div class="row"><button class="btn green" data-ok="${i}">✅ OK</button><button class="btn ghost" style="background:#eceaf6;color:#24204a" data-redo="${i}">🔄 Jinou</button></div>`;
      else body=`<div class="preview"><img src="${ph.src}"><span class="ok">✓ Hotovo</span></div><button class="btn ghost small" style="background:#eceaf6;color:#24204a" data-redo="${i}">🔄 Změnit fotku</button>`;
      return `<div class="task ${ph&&ph.ok?'done':''}"><h3><span class="n">${i+1}</span><span class="e">${t.e}</span><span>Vyfoť ${esc(t.t)}</span></h3>${body}</div>`;
    }).join('')}
    <button class="btn yellow" id="fin" ${done<n?'disabled':''} style="font-size:22px;padding:18px">🎉 Mám ${n<5?'všechny':'všech'} ${n}!</button>
    ${done<n?`<div class="hint">Až budou všechny fotky zelené, udělám z nich koláž 🖼️</div>`:''}
  `);
  document.getElementById('back').onclick=()=>showProfiles();
  $app.querySelectorAll('[data-cam]').forEach(b=>b.onclick=()=>takePhoto(+b.dataset.cam,true));
  $app.querySelectorAll('[data-gal]').forEach(b=>b.onclick=()=>takePhoto(+b.dataset.gal,false));
  $app.querySelectorAll('[data-ok]').forEach(b=>b.onclick=async()=>{
    const i=+b.dataset.ok; photos[i].ok=true; await DB.set('ph_'+game.pid+'_'+i,photos[i]);
    vibrate(40); fanfareSmall(); const y=window.scrollY; showPhotos(); window.scrollTo(0,y);
    if(allDone()) { confetti(30); setTimeout(()=>document.getElementById('fin')?.scrollIntoView({behavior:'smooth',block:'center'}),300); }
  });
  $app.querySelectorAll('[data-redo]').forEach(b=>b.onclick=async()=>{
    const i=+b.dataset.redo; photos[i]=null; await DB.del('ph_'+game.pid+'_'+i); const y=window.scrollY; showPhotos(); window.scrollTo(0,y);
  });
  document.getElementById('fin').onclick=finish;
}
const allDone = () => photos.length===game.n && photos.every(x=>x&&x.ok);
function fanfareSmall(){
  const a=audio(); if(!a) return; const t=a.currentTime;
  [784,1175].forEach((f,i)=>{const o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0.0001,t+i*.09);g.gain.exponentialRampToValueAtTime(.25,t+i*.09+.02);g.gain.exponentialRampToValueAtTime(.0001,t+i*.09+.25);o.connect(g).connect(a.destination);o.start(t+i*.09);o.stop(t+i*.09+.3);});
}
async function takePhoto(i,cam){
  const f=await pickImage(cam); if(!f) return;
  loading(true,'Načítám fotku…');
  try{
    const src=await fileToJpeg(f,1400,.85);
    shutter();
    photos[i]={src,ok:false}; await DB.set('ph_'+game.pid+'_'+i,photos[i]);
  }catch(e){ toast('Fotku se nepodařilo načíst 😕'); }
  loading(false);
  const y=window.scrollY; showPhotos(); window.scrollTo(0,y);
}

/* ---------- COLLAGE ---------- */
function rr(x,X,Y,W,H,r){x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+W,Y,X+W,Y+H,r);x.arcTo(X+W,Y+H,X,Y+H,r);x.arcTo(X,Y+H,X,Y,r);x.arcTo(X,Y,X+W,Y,r);x.closePath();}
function wrap(x,text,maxW){
  const words=text.split(' '); const lines=[]; let line='';
  for(const w of words){ const t=line?line+' '+w:w; if(x.measureText(t).width>maxW && line){lines.push(line);line=w;} else line=t; }
  if(line) lines.push(line); return lines;
}
async function buildCollage(p,g,srcs,earned){
  const tasks=g.drawn, n=tasks.length;
  const cols=n<=4?2:n<=9?3:4, rows=Math.ceil(n/cols);
  const cw=480, ch=680, gap=40, mx=40, gy=200, footH=170;
  const W=mx*2+cols*cw+(cols-1)*gap;
  const gridBottom=gy+rows*ch+(rows-1)*gap;
  const H=gridBottom+30+footH+30;
  const c=document.createElement('canvas'); c.width=W; c.height=H; const x=c.getContext('2d');
  const F='"Trebuchet MS",Roboto,"Noto Sans",sans-serif';
  const L=LEVELS[g.level], S=SEASONS[g.season];
  const grd=x.createLinearGradient(0,0,W,H); grd.addColorStop(0,'#2b1d6b'); grd.addColorStop(.5,'#5b2a9b'); grd.addColorStop(1,'#0f6e6a');
  x.fillStyle=grd; x.fillRect(0,0,W,H);
  x.globalAlpha=.08; x.fillStyle='#fff'; for(let i=0;i<40*cols*rows/4+30;i++){x.beginPath();x.arc(Math.random()*W,Math.random()*H,4+Math.random()*16,0,7);x.fill();} x.globalAlpha=1;
  x.textAlign='center'; x.fillStyle='#fff'; x.font=`900 74px ${F}`;
  x.shadowColor='rgba(0,0,0,.3)'; x.shadowOffsetY=5;
  x.fillText('📸 FotoLov', W/2, 100);
  x.shadowOffsetY=0; x.shadowColor='transparent';
  const d=new Date(); const ds=d.getDate()+'. '+(d.getMonth()+1)+'. '+d.getFullYear();
  x.font=`700 34px ${F}`; x.fillStyle='#ffd23f';
  x.fillText(`Fotovýprava: ${p.name} · ${S.e} ${S.name} · ${ds}`, W/2, 156);
  const fun=shuffle(FUN);
  for(let i=0;i<n;i++){
    const row=Math.floor(i/cols), col=i%cols;
    const inRow = row===rows-1 ? n-row*cols : cols;
    const off=(cols-inRow)*(cw+gap)/2;
    const X=mx+off+col*(cw+gap), Y=gy+row*(ch+gap);
    x.save();
    x.translate(X+cw/2,Y+ch/2); x.rotate((i%3===0?-1:1)*(1.2+Math.random()*1.3)*Math.PI/180); x.translate(-cw/2,-ch/2);
    x.shadowColor='rgba(0,0,0,.35)'; x.shadowBlur=24; x.shadowOffsetY=10;
    rr(x,0,0,cw,ch,22); x.fillStyle='#fff'; x.fill();
    x.shadowColor='transparent';
    const ps=448, px=16, py=16;
    const img=await loadImg(srcs[i]);
    const sc=Math.max(ps/img.naturalWidth, ps/img.naturalHeight);
    const sw=ps/sc, sh=ps/sc, sx=(img.naturalWidth-sw)/2, sy=(img.naturalHeight-sh)/2;
    x.save(); rr(x,px,py,ps,ps,14); x.clip(); x.drawImage(img,sx,sy,sw,sh,px,py,ps,ps); x.restore();
    x.beginPath(); x.arc(px+40,py+40,30,0,7); x.fillStyle='#ffd23f'; x.fill(); x.lineWidth=5; x.strokeStyle='#fff'; x.stroke();
    x.fillStyle='#24204a'; x.font=`900 ${i>=9?28:34}px ${F}`; x.textAlign='center'; x.textBaseline='middle'; x.fillText(String(i+1),px+40,py+42);
    x.font='44px sans-serif'; x.fillText(tasks[i].e, px+ps-38, py+42);
    x.textBaseline='alphabetic'; x.textAlign='left';
    x.fillStyle='#6b6790'; x.font=`700 24px ${F}`;
    x.fillText(`${i+1}. úkol – měl jsem vyfotit:`, 22, py+ps+42);
    x.fillStyle='#24204a'; x.font=`900 32px ${F}`;
    wrap(x,cap(tasks[i].t),cw-44).slice(0,2).forEach((ln,k)=>x.fillText(ln,22,py+ps+84+k*38));
    x.fillStyle='#ff2d75'; x.font=`italic 800 27px ${F}`;
    x.fillText(wrap(x,fun[i%fun.length].replace('{n}',p.name),cw-44)[0], 22, ch-24);
    x.restore();
  }
  const fy=gridBottom+30;
  x.textAlign='center'; x.textBaseline='middle';
  x.fillStyle='rgba(255,255,255,.15)'; rr(x,40,fy,W-80,footH,30); x.fill();
  const mid=fy+footH/2;
  const ax=110, ar=48;
  x.save(); x.beginPath(); x.arc(ax,mid,ar,0,7); x.closePath(); x.fillStyle='#fff'; x.fill();
  if(p.avatar){ const ai=await loadImg(p.avatar); x.clip(); x.drawImage(ai,ax-ar,mid-ar,ar*2,ar*2); }
  else { x.font='58px sans-serif'; x.fillStyle='#000'; x.fillText(p.emoji||'🙂',ax,mid+4); }
  x.restore();
  x.textAlign='left'; x.fillStyle='#fff'; x.font=`900 40px ${F}`; x.fillText(p.name, 180, mid-18);
  x.font=`700 28px ${F}`; x.fillStyle='#ffd23f'; x.fillText(`${L.emoji} ${L.name} · ${S.e} ${S.name} · 📸 ${n} · ⭐ +${earned}`, 180, mid+24);
  x.textAlign='right'; x.fillStyle='#fff'; x.font=`900 36px ${F}`; x.fillText('Mise splněna! 🎉', W-80, mid);
  return c.toDataURL('image/jpeg',.88);
}
async function finish(){
  if(!allDone()) return;
  loading(true,'Lepím koláž…');
  try{
    const p=current, g=game;
    const earned=Math.max(1,Math.round(LEVELS[g.level].stars*g.n/4)) + (g.season==='m'?2:0);
    const data=await buildCollage(p,g,photos.map(x=>x.src),earned);
    const id=uid();
    await DB.set('col_'+id,data);
    const al=(await dbGet('album_'+p.id))||[];
    al.unshift({id,date:Date.now(),level:g.level,season:g.season,n:g.n});
    await DB.set('album_'+p.id,al);
    p.stars+=earned; p.count++; saveProfiles();
    localStorage.removeItem(gameKey(p.id)); for(let i=0;i<g.n;i++) DB.del('ph_'+p.id+'_'+i);
    game=null; photos=[];
    loading(false);
    fanfare(); confetti(35); vibrate(120);
    showCollage(data,id,true);
  }catch(e){ loading(false); console.error(e); toast('Koláž se nepovedla: '+e.message); }
}
function showCollage(data,id,fresh){
  screen='collage';
  const p=current;
  render(`
    <div class="top"><button class="iconbtn" id="back">←</button><h1>${fresh?'Hotovo! 🎉':'Koláž'}</h1></div>
    <img class="collageimg" src="${data}">
    <div class="row" style="margin-bottom:12px">
      <button class="btn green" id="save">💾 Uložit</button>
      <button class="btn" id="share">📤 Poslat</button>
    </div>
    ${fresh?`<button class="btn pink" id="again">🎡 Nová výprava</button>`:`<button class="btn ghost" id="del">🗑️ Smazat koláž</button>`}
  `);
  document.getElementById('back').onclick=()=> fresh?showProfiles():showAlbum();
  const name=`FotoLov_${p.name}_${new Date().toISOString().slice(0,10)}_${id.slice(-4)}.jpg`;
  document.getElementById('save').onclick=()=>saveImage(data,name);
  document.getElementById('share').onclick=()=>shareImage(data,name);
  const ag=document.getElementById('again'); if(ag) ag.onclick=()=>openProfile(p.id);
  const dl=document.getElementById('del'); if(dl) dl.onclick=async()=>{
    if(!confirm('Smazat tuhle koláž?')) return;
    const al=((await dbGet('album_'+p.id))||[]).filter(a=>a.id!==id);
    await DB.set('album_'+p.id,al); await DB.del('col_'+id); showAlbum();
  };
}
function saveImage(data,name){
  const b64=data.split(',')[1];
  if(bridge && bridge.saveImage){
    const r=bridge.saveImage(b64,name);
    toast(r==='ok'?'✅ Uloženo do Galerie (složka FotoLov)':'😕 Uložení se nepovedlo');
  } else {
    const a=document.createElement('a'); a.href=data; a.download=name; document.body.appendChild(a); a.click(); a.remove();
    toast('✅ Stahuju obrázek');
  }
}
async function shareImage(data,name){
  const b64=data.split(',')[1];
  if(bridge && bridge.shareImage){ bridge.shareImage(b64,name); return; }
  try{
    const blob=await (await fetch(data)).blob(); const file=new File([blob],name,{type:'image/jpeg'});
    if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:'FotoLov'}); return; }
  }catch(e){ if(e && e.name==='AbortError') return; }
  saveImage(data,name);
}

/* ---------- ALBUM ---------- */
async function showAlbum(){
  screen='album';
  const p=current;
  const al=(await dbGet('album_'+p.id))||[];
  const items=[];
  for(const a of al){ const d=await dbGet('col_'+a.id); if(d) items.push({...a,data:d}); }
  render(`
    <div class="top"><button class="iconbtn" id="back">←</button><h1>Album – ${esc(p.name)}</h1></div>
    ${items.length?`<div class="album">${items.map(it=>`<div class="it" data-id="${it.id}"><img src="${it.data}"><div class="d">${new Date(it.date).toLocaleDateString('cs-CZ')} · ${LEVELS[it.level].emoji}${it.season?SEASONS[it.season].e:''}${it.n?' · 📸 '+it.n:''}</div></div>`).join('')}</div>`
      :`<div class="empty">Zatím tu nic není.<br>Zatoč kolem a vyraž na první výpravu! 🎡</div>`}
  `);
  document.getElementById('back').onclick=()=>openProfile(p.id);
  $app.querySelectorAll('.it').forEach(el=>el.onclick=()=>{const it=items.find(i=>i.id===el.dataset.id); showCollage(it.data,it.id,false);});
}

/* ---------- BACK BUTTON (Android) ---------- */
window.onAndroidBack=function(){
  if(document.querySelector('.result')){ document.querySelector('.result button').click(); return true; }
  if(wheel.spinning) return true;
  switch(screen){
    case 'profiles': return false;
    case 'edit': case 'spin': case 'photo': showProfiles(); return true;
    case 'album': openProfile(current.id); return true;
    case 'collage': document.getElementById('back').click(); return true;
  }
  return false;
};
window.addEventListener('resize',()=>{ if(screen==='spin'){ sizeWheel(); drawWheel(); } });

showProfiles();
</script>
